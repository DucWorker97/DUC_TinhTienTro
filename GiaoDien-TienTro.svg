  <text x="56" y="1208" font-size="11" fill="#64748b">Chi phí chung</text>
  <text x="386" y="1208" text-anchor="end" font-size="11" fill="#334155">1.150.000 đ</text>
  <text x="56" y="1228" font-size="11" fill="#64748b">+ Điện riêng</text>
  <text x="386" y="1228" text-anchor="end" font-size="11" fill="#334155">0 đ</text>
  <text x="56" y="1248" font-size="11" fill="#64748b">− Trả trước</text>
  <text x="386" y="1248" text-anchor="end" font-size="11" fill="#334155">0 đ</text>
  <line x1="56" y1="1262" x2="386" y2="1262" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="56" y="1290" font-size="10" font-weight="600" letter-spacing="1" fill="#64748b">PHẢI TRẢ</text>
  <text x="386" y="1294" text-anchor="end" font-size="26" font-weight="800" fill="#0e7490">1.150.000 đ</text>

  <text x="220" y="1340" text-anchor="middle" font-size="10" fill="#94a3b8">Cảm ơn &amp; hẹn gặp lại 💙</text>

